name: Meken checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: docker build -t meken:test .
      - uses: actions/upload-artifact@v4
        with:
          name: meken-release
          path: dist/meken
          include-hidden-files: true
